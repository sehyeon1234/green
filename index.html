<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>(가상) 행정정보 통합관리 기본법 조항 검색기</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>(가상) 행정정보 통합관리 기본법 조항 검색</h1>
    <div class="bar">
      <input id="q" type="search" placeholder="검색어 (예: 기본계획)" aria-label="본문 검색어" autofocus>
      <span id="count" role="status" aria-live="polite"></span>
    </div>
  </header>
  <main id="list"></main>
  <script src="app.js"></script>
</body>
</html>
